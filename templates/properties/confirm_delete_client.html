{% extends 'base.html' %}
{% block title %}Удаление клиента{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-danger"><div class="card-header bg-danger text-white">Удаление клиента</div>
<div class="card-body">
<p>Удалить клиента <strong>{{ client.full_name }}</strong>?</p>
<form method="post">{% csrf_token %}
<button type="submit" class="btn btn-danger">Удалить</button>
<a href="{% url 'properties:client_list' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
</form>
</div>
</div>
</div></div>
{% endblock %}
