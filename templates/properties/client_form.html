{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-0 shadow-sm">
<div class="card-header bg-primary text-white"><h5 class="mb-0">{{ title }}</h5></div>
<div class="card-body p-4">
<form method="post">{% csrf_token %}
{% for field in form %}
<div class="mb-3"><label class="form-label fw-bold">{{ field.label }}</label>{{ field }}
{% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}</div>
{% endfor %}
<button type="submit" class="btn btn-primary">Сохранить</button>
<a href="{% url 'properties:client_list' %}" class="btn btn-outline-secondary ms-2">Отмена</a>
</form>
</div>
</div>
</div></div>
{% endblock %}
