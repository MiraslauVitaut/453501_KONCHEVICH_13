{% extends 'base.html' %}
{% block title %}Удаление объекта{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card border-danger shadow-sm">
<div class="card-header bg-danger text-white"><h5 class="mb-0">Подтверждение удаления</h5></div>
<div class="card-body">
<p>Вы действительно хотите удалить объект <strong>{{ property.title }}</strong>?</p>
<form method="post">{% csrf_token %}
<button type="submit" class="btn btn-danger">Удалить</button>
<a href="{% url 'properties:detail' property.pk %}" class="btn btn-outline-secondary ms-2">Отмена</a>
</form>
</div>
</div>
</div></div>
{% endblock %}
