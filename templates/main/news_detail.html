{% extends 'base.html' %}
{% block title %}{{ article.title }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
<div class="col-md-8">
    <a href="{% url 'properties:news' %}" class="btn btn-sm btn-outline-secondary mb-3">← Назад к новостям</a>
    <h2>{{ article.title }}</h2>
    <p class="text-muted">{{ article.created_at|date:"d/m/Y H:i" }}</p>
    {% if article.image %}<img src="{{ article.image.url }}" class="img-fluid rounded mb-3">{% endif %}
    <div>{{ article.content|linebreaks }}</div>
</div>
</div>
{% endblock %}
